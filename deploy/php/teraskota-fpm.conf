; Teras Kota POS - Low-Memory PHP-FPM Pool Configuration
; Tailored for 1GB RAM / 1 vCPU VPS on Ubuntu x86_64 and ARM64

[teraskota]
user = www-data
group = www-data

listen = /run/php/php-fpm-teraskota.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Use ondemand process manager to free memory immediately when idle
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Timeout safety
request_terminate_timeout = 60s
catch_workers_output = yes

; PHP runtime limits
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_flag[log_errors] = on
