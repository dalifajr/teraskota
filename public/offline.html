<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Offline — KasirLoka POS</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            text-align: center;
            padding: 16px;
        }

        .offline-box {
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.35rem;
            color: #14532d;
        }

        p {
            margin: 0 0 22px;
            color: #475569;
            font-size: 0.94rem;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button,
        a.btn-pos {
            border: 0;
            border-radius: 10px;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        button {
            background: #14532d;
            color: #ffffff;
        }

        a.btn-pos {
            background: #f0fdf4;
            color: #14532d;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>

<body>
    <div class="offline-box">
        <h1>Tidak Ada Koneksi Internet</h1>

        <p>
            Halaman panel admin memerlukan koneksi internet. Jika Anda sedang bertugas di kasir, Anda tetap dapat melayani transaksi secara offline melalui Terminal Kasir POS.
        </p>

        <div class="actions">
            <a href="/pos" class="btn-pos">Buka Terminal Kasir Offline (/pos)</a>
            <button type="button" onclick="window.location.reload()">Muat Ulang Halaman</button>
        </div>
    </div>
</body>

</html>
