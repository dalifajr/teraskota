<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidak Ada Koneksi</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f8faf7;
            color: #14532d;
            text-align: center;
        }

        .offline-box {
            max-width: 400px;
            padding: 32px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 20px;
            background: #14532d;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="offline-box">
        <h1>Tidak Ada Koneksi Internet</h1>

        <p>
            Dashboard Penjualan Teras Kota memerlukan koneksi internet
            untuk mengakses dan menyimpan data transaksi.
        </p>

        <button onclick="window.location.reload()">
            Coba Lagi
        </button>
    </div>
</body>

</html>
